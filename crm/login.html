<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select My Venue CRM | Staff Login</title>
  <link rel="stylesheet" href="crm.css">
</head>
<body class="crm-auth-body">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="logo-header.png" alt="Select My Venue">
      </div>

      <div class="auth-badge"><span></span> STAFF CRM</div>
      <h1>Welcome back.</h1>
      <p class="auth-subtitle">Sign in to manage customer enquiries and follow-ups.</p>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="staff@selectmyvenue.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
        </div>

        <button class="primary-btn" type="submit">Sign In <span>→</span></button>
        <p id="loginMessage" class="form-message" role="alert"></p>
      </form>

      <p class="auth-footer">Select My Venue • Smart Venue Discovery</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="crm.js"></script>
</body>
</html>
