<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Select My Venue — CRM Login</title>

  <!-- CRM CSS -->
  <link
    rel="stylesheet"
    href="../crm.css"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="auth-page">

  <section class="auth-card">

    <!-- LOGO -->
    <div class="crm-logo">

      <img
        src="../logo.png"
        alt="Select My Venue"
      >

    </div>


    <!-- BADGE -->
    <div class="auth-badge">

      <span></span>

      STAFF CRM

    </div>


    <!-- TITLE -->
    <h1>
      Welcome back.
    </h1>


    <p class="auth-subtitle">
      Sign in to manage customer enquiries and follow-ups.
    </p>


    <!-- LOGIN FORM -->
    <form
      id="loginForm"
      class="auth-form"
    >

      <!-- EMAIL -->
      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="staff@selectmyvenue.com"
          required
        >

      </div>


      <!-- PASSWORD -->
      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        >

      </div>


      <!-- LOGIN BUTTON -->
      <button
        id="loginBtn"
        class="primary-btn"
        type="submit"
      >

        <span class="btn-text">
          Sign In
        </span>

        <span class="btn-arrow">
          →
        </span>

      </button>


      <!-- MESSAGE -->
      <p
        id="loginMessage"
        class="form-message"
        role="alert"
      ></p>

    </form>


    <!-- FOOTER -->
    <p class="auth-footer">
      Select My Venue • Smart Venue Discovery
    </p>

  </section>


  <!-- =====================================================
       SUPABASE LOGIN SCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       SUPABASE CONFIG
    ===================================================== */

    const SUPABASE_URL =
      "https://uajqwyoqbbswkfiwosyw.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";


    /* =====================================================
       CREATE SUPABASE CLIENT
    ===================================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================================
       DOM
    ===================================================== */

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginMessage =
      document.getElementById("loginMessage");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");


    /* =====================================================
       CHECK EXISTING SESSION
    ===================================================== */

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.getSession();


        if (error) {
          console.error(
            "Session check error:",
            error
          );

          return;
        }


        if (
          data &&
          data.session
        ) {

          window.location.href =
            "dashboard.html";

        }

      } catch (error) {

        console.error(
          "Session check failed:",
          error
        );

      }

    }


    /* =====================================================
       SHOW MESSAGE
    ===================================================== */

    function showMessage(
      message,
      type = "error"
    ) {

      if (!loginMessage) {
        return;
      }

      loginMessage.textContent =
        message;

      loginMessage.className =
        "form-message " + type;

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email) {

          showMessage(
            "Please enter your email address."
          );

          emailInput.focus();

          return;
        }


        if (!password) {

          showMessage(
            "Please enter your password."
          );

          passwordInput.focus();

          return;
        }


        /* BUTTON LOADING */

        loginBtn.disabled = true;


        const originalButtonHTML =
          loginBtn.innerHTML;


        loginBtn.innerHTML =
          '<span class="btn-text">Signing in...</span><span class="btn-arrow">→</span>';


        showMessage(
          "",
          "success"
        );


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (error) {

            console.error(
              "Supabase login error:",
              error
            );


            showMessage(
              error.message ||
              "Unable to sign in. Please check your email and password."
            );


            loginBtn.disabled = false;

            loginBtn.innerHTML =
              originalButtonHTML;

            return;
          }


          if (
            data &&
            data.session
          ) {

            showMessage(
              "Login successful. Opening CRM...",
              "success"
            );


            /*
              Small delay so the user can
              see the successful login message.
            */

            setTimeout(
              function() {

                window.location.href =
                  "dashboard.html";

              },
              300
            );

          } else {

            showMessage(
              "Login completed but no session was created."
            );


            loginBtn.disabled = false;

            loginBtn.innerHTML =
              originalButtonHTML;

          }


        } catch (error) {

          console.error(
            "Login exception:",
            error
          );


          showMessage(
            "Something went wrong while signing in."
          );


          loginBtn.disabled = false;

          loginBtn.innerHTML =
            originalButtonHTML;

        }

      }
    );


    /* =====================================================
       ENTER KEY / INPUT CLEANUP
    ===================================================== */

    emailInput.addEventListener(
      "input",
      function() {

        if (loginMessage.textContent) {

          loginMessage.textContent = "";

        }

      }
    );


    passwordInput.addEventListener(
      "input",
      function() {

        if (loginMessage.textContent) {

          loginMessage.textContent = "";

        }

      }
    );


    /* =====================================================
       START
    ===================================================== */

    checkExistingSession();

  </script>

</body>

</html>
