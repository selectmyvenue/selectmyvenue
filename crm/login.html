<!-- =====================================================
     LOGIN SCRIPT
====================================================== -->

<script>

    const supabaseLogin =
        window.supabase.createClient(
            window.SUPABASE_URL,
            window.SUPABASE_ANON_KEY
        );


    const loginForm =
        document.getElementById("loginForm");

    const loginBtn =
        document.getElementById("loginBtn");

    const loginMessage =
        document.getElementById("loginMessage");


    function showLoginMessage(
        message,
        type = "error"
    ) {

        loginMessage.textContent =
            message;

        loginMessage.className =
            "login-message " + type;
    }


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email || !password) {

                showLoginMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;
            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "Signing in...";

            showLoginMessage("");


            try {

                const {
                    data,
                    error
                } =
                    await supabaseLogin.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });


                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showLoginMessage(
                        error.message ||
                        "Invalid email or password.",
                        "error"
                    );

                    return;
                }


                if (data && data.session) {

                    showLoginMessage(
                        "Login successful. Opening CRM...",
                        "success"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "./dashboard.html";

                        },
                        500
                    );

                } else {

                    showLoginMessage(
                        "Login failed. Please try again.",
                        "error"
                    );
                }


            } catch (error) {

                console.error(
                    "Login exception:",
                    error
                );

                showLoginMessage(
                    "Unable to connect to Supabase.",
                    "error"
                );

            } finally {

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login to CRM";
            }

        }
    );


    /* =====================================================
       CHECK EXISTING SESSION
    ====================================================== */

    (async function checkExistingSession() {

        try {

            const {
                data
            } =
                await supabaseLogin.auth
                    .getSession();


            if (
                data &&
                data.session
            ) {

                window.location.href =
                    "./dashboard.html";
            }

        } catch (error) {

            console.error(
                "Session check failed:",
                error
            );

        }

    })();

</script>
