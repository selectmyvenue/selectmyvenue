<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Select My Venue — CRM Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CRM CSS -->
  <link rel="stylesheet" href="crm.css">
</head>

<body class="login-page">

  <main class="auth-container">

    <section class="auth-card">

      <!-- LOGO -->
      <div class="crm-logo">
        <img
          src="../logo.png"
          alt="Select My Venue"
        >
      </div>

      <!-- BADGE -->
      <div class="auth-badge">
        <span></span>
        STAFF CRM
      </div>

      <!-- TITLE -->
      <h1>
        Welcome back.
      </h1>

      <p class="auth-subtitle">
        Sign in to manage customer enquiries and follow-ups.
      </p>

      <!-- LOGIN FORM -->
      <form
        id="loginForm"
        class="auth-form"
      >

        <!-- EMAIL -->
        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="staff@selectmyvenue.com"
            required
          >

        </div>

        <!-- PASSWORD -->
        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >

        </div>

        <!-- LOGIN BUTTON -->
        <button
          id="loginBtn"
          class="primary-btn"
          type="submit"
        >
          <span id="loginBtnText">
            Sign In
          </span>

          <span>
            →
          </span>
        </button>

        <!-- MESSAGE -->
        <p
          id="loginMessage"
          class="form-message"
          role="alert"
        ></p>

      </form>

      <!-- FOOTER -->
      <p class="auth-footer">
        Select My Venue • Smart Venue Discovery
      </p>

    </section>

  </main>


  <!-- =====================================================
       LOGIN SCRIPT
       ===================================================== -->

  <script>

    const SUPABASE_URL =
      "https://uajqwyoqbbswkfiwosyw.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginBtnText =
      document.getElementById("loginBtnText");

    const loginMessage =
      document.getElementById("loginMessage");


    function showLoginMessage(
      message,
      type = "error"
    ) {

      if (!loginMessage) {
        return;
      }

      loginMessage.textContent =
        message;

      loginMessage.className =
        "form-message " + type;
    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showLoginMessage(
            "Please enter your email and password.",
            "error"
          );

          return;
        }


        loginBtn.disabled = true;

        loginBtnText.textContent =
          "Signing in...";

        showLoginMessage(
          "",
          "success"
        );


        try {

          const {
            data,
            error
          } =
            await supabaseClient
              .auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (error) {
            throw error;
          }


          if (!data || !data.user) {

            throw new Error(
              "Login was not completed."
            );

          }


          showLoginMessage(
            "Login successful. Opening CRM...",
            "success"
          );


          /*
            IMPORTANT:
            dashboard.html is inside /crm/
          */

          window.location.href =
            "dashboard.html";


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          let message =
            "Unable to sign in.";


          if (
            error &&
            error.message
          ) {

            message =
              error.message;

          }


          showLoginMessage(
            message,
            "error"
          );


          loginBtn.disabled =
            false;

          loginBtnText.textContent =
            "Sign In";

        }

      }
    );


    /*
      If the user is already logged in,
      don't show the login page again.
    */

    async function checkExistingSession() {

      try {

        const {
          data
        } =
          await supabaseClient
            .auth
            .getSession();


        if (
          data &&
          data.session
        ) {

          window.location.href =
            "dashboard.html";

        }

      } catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }

    }


    checkExistingSession();

  </script>

</body>
</html>
