<body>


    <!-- =====================================================
         LOGIN PAGE
    ===================================================== -->

    <main class="login-page">


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section
            class="login-card"
            aria-labelledby="loginTitle"
        >


            <!-- LOGO -->

            <img
                src="../logo.png"
                alt="Select My Venue"
                class="login-logo"
            >


            <!-- BRAND -->

            <div class="login-brand">

                <h1 id="loginTitle">
                    Select My Venue CRM
                </h1>

                <p>
                    Employee Lead Management System
                </p>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                class="login-form"
            >


                <!-- EMAIL -->

                <div class="login-field">

                    <label for="email">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="login-field">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn"
                >
                    Login to CRM
                </button>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></div>


            </form>


            <!-- FOOTER -->

            <div class="login-footer">
                Select My Venue · Secure Employee CRM
            </div>


        </section>


    </main>


    <!-- =====================================================
         LOGIN SCRIPT
    ===================================================== -->

    <script>

        /*
         * Supabase configuration
         *
         * These values are used only by the login page.
         */

        const SUPABASE_URL =
            "https://uajqwyoqbbswkfiwosyw.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";


        /*
         * Create Supabase client
         */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /*
         * Login elements
         */

        const loginForm =
            document.getElementById("loginForm");

        const loginBtn =
            document.getElementById("loginBtn");

        const loginMessage =
            document.getElementById("loginMessage");


        /*
         * Show message
         */

        function showLoginMessage(
            message,
            type = "error"
        ) {

            loginMessage.textContent =
                message;

            loginMessage.className =
                "login-message " + type;

        }


        /*
         * Check existing session
         */

        async function checkExistingSession() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (error) {

                    console.error(
                        "Session check error:",
                        error
                    );

                    return;

                }


                if (data.session) {

                    window.location.href =
                        "dashboard.html";

                }

            } catch (error) {

                console.error(
                    "Session check failed:",
                    error
                );

            }

        }


        /*
         * Login
         */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    showLoginMessage(
                        "Please enter email and password.",
                        "error"
                    );

                    return;

                }


                loginBtn.disabled = true;

                loginBtn.textContent =
                    "Signing in...";

                showLoginMessage(
                    "",
                    "success"
                );


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({
                                email: email,
                                password: password
                            });


                    if (error) {

                        console.error(
                            "Login error:",
                            error
                        );

                        showLoginMessage(
                            error.message ||
                            "Invalid email or password.",
                            "error"
                        );

                        loginBtn.disabled = false;

                        loginBtn.textContent =
                            "Login to CRM";

                        return;

                    }


                    if (data.session) {

                        showLoginMessage(
                            "Login successful. Opening CRM...",
                            "success"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "dashboard.html";

                            },
                            300
                        );

                    }

                } catch (error) {

                    console.error(
                        "Login failed:",
                        error
                    );

                    showLoginMessage(
                        "Unable to login. Please try again.",
                        "error"
                    );

                    loginBtn.disabled = false;

                    loginBtn.textContent =
                        "Login to CRM";

                }

            }
        );


        /*
         * Start
         */

        checkExistingSession();

    </script>


</body>
