<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Select My Venue CRM — Login</title>

    <link
        rel="stylesheet"
        href="./crm.css"
    >

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: min(440px, 100%);
            padding: 38px;
            border-radius: 24px;
            background: rgba(20, 28, 45, 0.96);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
        }

        .login-logo {
            display: block;
            width: 92px;
            height: auto;
            margin: 0 auto 22px;
            object-fit: contain;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-brand h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 700;
        }

        .login-brand p {
            margin: 8px 0 0;
            opacity: 0.7;
            font-size: 14px;
        }

        .login-form {
            display: grid;
            gap: 18px;
        }

        .login-field {
            display: grid;
            gap: 8px;
        }

        .login-field label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .login-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.10);
            background: rgba(255,255,255,0.05);
            color: inherit;
            outline: none;
            font-size: 15px;
        }

        .login-field input:focus {
            border-color: rgba(52, 211, 153, 0.7);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.10);
        }

        .login-btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 14px 18px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(
                135deg,
                #159a8c,
                #087f73
            );
            transition: 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-message {
            min-height: 20px;
            text-align: center;
            font-size: 13px;
            margin-top: 4px;
        }

        .login-message.error {
            color: #ff8f8f;
        }

        .login-message.success {
            color: #63e6be;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            opacity: 0.45;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <img
            src="../logo.png"
            alt="Select My Venue"
            class="login-logo"
        >

        <div class="login-brand">

            <h1>
                Select My Venue CRM
            </h1>

            <p>
                Employee Lead Management System
            </p>

        </div>


        <form
            id="loginForm"
            class="login-form"
        >

            <div class="login-field">

                <label for="email">
                    EMAIL ADDRESS
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="login-field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginBtn"
                class="login-btn"
            >
                Login to CRM
            </button>


            <div
                id="loginMessage"
                class="login-message"
                role="alert"
                aria-live="polite"
            ></div>

        </form>


        <div class="login-footer">
            Select My Venue · Secure Employee CRM
        </div>

    </div>

</div>


<script>

    /* =====================================================
       SUPABASE CONFIGURATION
    ===================================================== */

    const SUPABASE_URL =
        "https://uajqwyoqbbswkfiwosyw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";


    /* =====================================================
       SUPABASE CLIENT
    ===================================================== */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =====================================================
       DOM
    ===================================================== */

    const loginForm =
        document.getElementById("loginForm");

    const loginBtn =
        document.getElementById("loginBtn");

    const loginMessage =
        document.getElementById("loginMessage");


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showLoginMessage(
        message,
        type = "error"
    ) {

        loginMessage.textContent =
            message;

        loginMessage.className =
            "login-message " + type;

    }


    /* =====================================================
       CHECK EXISTING SESSION
    ===================================================== */

    async function checkExistingSession() {

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();

            if (error) {
                console.error(
                    "Session check error:",
                    error
                );

                return;
            }

            if (data && data.session) {

                window.location.href =
                    "./dashboard.html";

            }

        } catch (error) {

            console.error(
                "Session check failed:",
                error
            );

        }

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email || !password) {

                showLoginMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;

            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "Signing in...";

            showLoginMessage(
                "",
                "success"
            );


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });


                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showLoginMessage(
                        error.message ||
                        "Invalid email or password.",
                        "error"
                    );

                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        "Login to CRM";

                    return;

                }


                if (
                    data &&
                    data.session
                ) {

                    showLoginMessage(
                        "Login successful. Opening CRM...",
                        "success"
                    );

                    setTimeout(
                        function() {

                            window.location.href =
                                "./dashboard.html";

                        },
                        300
                    );

                    return;

                }


                showLoginMessage(
                    "Login failed. Please try again.",
                    "error"
                );

                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "Login to CRM";


            } catch (error) {

                console.error(
                    "Unexpected login error:",
                    error
                );

                showLoginMessage(
                    "Unable to connect to the CRM. Please try again.",
                    "error"
                );

                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "Login to CRM";

            }

        }
    );


    /* =====================================================
       AUTH STATE
    ===================================================== */

    supabaseClient.auth.onAuthStateChange(
        function(event, session) {

            if (
                event === "SIGNED_IN" &&
                session
            ) {

                window.location.href =
                    "./dashboard.html";

            }

        }
    );


    /* =====================================================
       START
    ===================================================== */

    checkExistingSession();

</script>

</body>
</html>
