name: SEO Static Audit

on:
  pull_request:
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'seo/audit_static_seo.py'
      - '.github/workflows/seo-static-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run read-only static SEO audit
        run: python seo/audit_static_seo.py
