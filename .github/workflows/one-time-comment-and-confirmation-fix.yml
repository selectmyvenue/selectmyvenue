name: One-time enquiry comment and confirmation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-comment-and-confirmation-fix.yml'

permissions:
  contents: write

jobs:
  fix-public-enquiries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply public enquiry fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = '20260909-comment-fix-6'
          changed = []

          def save(path, text, original):
              if text != original:
                  Path(path).write_text(text, encoding='utf-8')
                  changed.append(path)

          # Main homepage + popup: customer comments belong in contact_remark.
          # Do not write website text into internal_notes, which is CRM/staff data.
          path = 'script.js'
          original = Path(path).read_text(encoding='utf-8')
          text = original
          text = re.sub(r'\n\s*internal_notes:\s*\n\s*customerRequirements\s*\|\|\s*null,', '', text)
          text = re.sub(r'\n\s*internal_notes:\s*other\s*\|\|\s*null,', '', text)
          save(path, text, original)

          # Homepage insert bridge: keep customer comment in contact_remark only.
          path = 'homepage-venues.js'
          original = Path(path).read_text(encoding='utf-8')
          text = original
          text = re.sub(r'\n\s*if \(comment && !clean\(next\.internal_notes\)\) next\.internal_notes = comment;', '', text)
          save(path, text, original)

          # Quick enquiry forms: remove internal_notes write and make the confirmation
          # card tall enough for the full multi-line message on every screen size.
          path = 'quick-enquiry.js'
          original = Path(path).read_text(encoding='utf-8')
          text = original
          text = text.replace('      if (comment) payload.internal_notes = comment;\n', '')
          anchor = '      .quick-enquiry-message.error{display:block!important;margin:12px 0!important;padding:12px!important;border-radius:12px!important;background:#fff1f1!important;color:#a4161a!important;font-weight:850!important}\n'
          extra = '''      .quick-enquiry-form{grid-auto-rows:auto!important;align-items:start!important}\n      .quick-enquiry-message.success{grid-column:1/-1!important;height:auto!important;min-height:88px!important;max-height:none!important;overflow:visible!important;align-self:stretch!important;padding-top:16px!important;padding-bottom:16px!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important}\n      .quick-enquiry-message.success:before{top:18px!important;transform:none!important}\n'''
          if extra not in text:
              if anchor not in text:
                  raise SystemExit('quick enquiry CSS anchor not found')
              text = text.replace(anchor, extra + anchor, 1)
          old_panel = '''      if (successPanel) {\n        successPanel.hidden = false;\n        successPanel.textContent = PREMIUM_SUCCESS;\n      }'''
          new_panel = '''      if (successPanel) {\n        successPanel.hidden = true;\n        successPanel.textContent = \"\";\n      }'''
          if old_panel in text:
              text = text.replace(old_panel, new_panel, 1)
          save(path, text, original)

          # Browse multi-venue enquiry: keep public comment in contact_remark only.
          path = 'venues.js'
          original = Path(path).read_text(encoding='utf-8')
          text = original.replace('contact_remark:other||null,internal_notes:other||null,', 'contact_remark:other||null,')
          save(path, text, original)

          # Any legacy smart-match public writer should not inject internal_notes either.
          for path in ['smv-smart-match-core.js', 'smv-smart-match.js']:
              p = Path(path)
              if not p.exists():
                  continue
              original = p.read_text(encoding='utf-8')
              text = original
              text = re.sub(r'\n\s*internal_notes\s*:\s*[^,\n]+,?', '', text)
              text = re.sub(r'\n\s*if \([^\n]*\) payload\.internal_notes\s*=\s*[^;]+;', '', text)
              save(path, text, original)

          # Cache-bust updated scripts so live browsers do not keep the old behavior.
          targets = ['script.js', 'homepage-venues.js', 'quick-enquiry.js', 'venues.js', 'smv-smart-match.js']
          for html in Path('.').glob('*.html'):
              original = html.read_text(encoding='utf-8')
              text = original
              for filename in targets:
                  text = re.sub(re.escape(filename) + r'(?:\?v=[^\"\']+)?', filename + '?v=' + VERSION, text)
              save(str(html), text, original)

          # Guardrails
          script = Path('script.js').read_text(encoding='utf-8')
          home = Path('homepage-venues.js').read_text(encoding='utf-8')
          quick = Path('quick-enquiry.js').read_text(encoding='utf-8')
          if 'internal_notes:\n            customerRequirements' in script or 'internal_notes: other || null' in script:
              raise SystemExit('script.js still writes public comments to internal_notes')
          if 'next.internal_notes = comment' in home:
              raise SystemExit('homepage bridge still writes internal_notes')
          if 'payload.internal_notes = comment' in quick:
              raise SystemExit('quick enquiry still writes internal_notes')
          if 'min-height:88px!important' not in quick or 'contact_remark = comment' not in quick:
              raise SystemExit('quick enquiry confirmation/comment guardrail failed')

          print('Changed files:')
          for item in sorted(set(changed)):
              print(' -', item)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Select My Venue Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Fix customer comments and quick confirmation layout"
          git push origin HEAD:main
