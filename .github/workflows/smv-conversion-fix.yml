name: SMV conversion tracking fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smv-conversion-fix.yml'

permissions:
  contents: write

jobs:
  patch-conversion-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch successful CRM lead conversions only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          label = 'AW-18435642634/_rfMCLfZsfAcEIqq5tZE'
          if label in text:
              raise SystemExit('Conversion label already exists; refusing duplicate patch.')

          customer_start = text.index('function setupCustomerEnquiry()')
          popup_start = text.index('function setupAutoEnquiryPopup()', customer_start)
          before_customer = text[:customer_start]
          customer = text[customer_start:popup_start]
          popup_and_rest = text[popup_start:]

          main_needle = '        form.reset();'
          if customer.count(main_needle) != 1:
              raise SystemExit('Expected exactly one main enquiry form.reset insertion point.')
          customer = customer.replace(main_needle, '        trackGoogleAdsLeadConversion();\n\n        form.reset();', 1)

          popup_needle = '      setValue("customerName", customerName);'
          if popup_and_rest.count(popup_needle) != 1:
              raise SystemExit('Expected exactly one popup post-save synchronization point.')
          popup_and_rest = popup_and_rest.replace(popup_needle, '      trackGoogleAdsLeadConversion();\n\n' + popup_needle, 1)

          helper = '\n\n/* =========================================================\n   GOOGLE ADS LEAD CONVERSION\n   Fires only after a genuine customer enquiry is saved to CRM.\n   ========================================================= */\n\nfunction trackGoogleAdsLeadConversion() {\n  if (typeof window.gtag !== "function") {\n    console.warn(\n      "Select My Venue: Google Ads conversion not sent because gtag is unavailable."\n    );\n    return false;\n  }\n\n  try {\n    window.gtag("event", "conversion", {\n      send_to: "AW-18435642634/_rfMCLfZsfAcEIqq5tZE",\n      value: 1.0,\n      currency: "INR"\n    });\n\n    console.log(\n      "Select My Venue: Google Ads lead conversion sent after successful CRM save."\n    );\n    return true;\n  } catch (error) {\n    console.warn(\n      "Select My Venue: Google Ads conversion tracking error:",\n      error\n    );\n    return false;\n  }\n}\n'

          text = before_customer + customer + popup_and_rest + helper

          if text.count(label) != 1:
              raise SystemExit('Conversion label should exist exactly once.')
          if text.count('trackGoogleAdsLeadConversion();') != 2:
              raise SystemExit('Conversion helper should be called exactly twice.')

          path.write_text(text, encoding='utf-8')
          PY

          node --check script.js

      - name: Commit website fix and clean temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/smv-conversion-fix.yml
          git config user.name "Select My Venue Automation"
          git config user.email "actions@users.noreply.github.com"
          git add script.js .github/workflows/smv-conversion-fix.yml
          git commit -m "Track Google Ads conversion after successful CRM enquiry save"
          git push origin HEAD:main
