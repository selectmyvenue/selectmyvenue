name: One-time enquiry consistency fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-enquiry-fix.yml'

permissions:
  contents: write

jobs:
  fix-enquiries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply enquiry fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          DESIRED = "Requirement received! Thank you for choosing Select My Venue. Our venue team will contact you within 30 minutes to understand your event and help you with suitable venue options."
          changed = []

          def save(path, text, original):
              if text != original:
                  Path(path).write_text(text, encoding="utf-8")
                  changed.append(path)

          # 1) Homepage: remove invalid public priority before INSERT, and save customer comment
          #    to both the dedicated customer remark field and the CRM-visible comment field.
          path = "homepage-venues.js"
          original = Path(path).read_text(encoding="utf-8")
          text = original
          text = re.sub(r'const SUCCESS_TEXT = ".*?";', 'const SUCCESS_TEXT = ' + repr(DESIRED).replace("'", '"') + ';', text, count=1)
          text = re.sub(r'const DUPLICATE_TEXT = .*?;', 'const DUPLICATE_TEXT = SUCCESS_TEXT;', text, count=1)
          bridge_old = '''              const next = { ...row };\n              if (comment && !clean(next.contact_remark)) next.contact_remark = comment;'''
          bridge_new = '''              const next = { ...row };\n              delete next.priority;\n              if (comment && !clean(next.contact_remark)) next.contact_remark = comment;\n              if (comment && !clean(next.internal_notes)) next.internal_notes = comment;'''
          if bridge_old in text:
              text = text.replace(bridge_old, bridge_new, 1)
          elif "delete next.priority;" not in text or "next.internal_notes" not in text:
              raise SystemExit("Expected homepage enquiry insert bridge was not found")
          save(path, text, original)

          # 2) Quick enquiry pages: exact confirmation, no priority, customer comments visible in CRM.
          path = "quick-enquiry.js"
          original = Path(path).read_text(encoding="utf-8")
          text = original
          text = re.sub(r'const PREMIUM_SUCCESS = ".*?";', 'const PREMIUM_SUCCESS = ' + repr(DESIRED).replace("'", '"') + ';', text, count=1)
          text = re.sub(r'\n\s*priority:\s*getPriority\([^\n]*\),?', '', text)
          if "if (comment) payload.contact_remark = comment;" in text and "if (comment) payload.internal_notes = comment;" not in text:
              text = text.replace("if (comment) payload.contact_remark = comment;", "if (comment) payload.contact_remark = comment;\n      if (comment) payload.internal_notes = comment;", 1)
          save(path, text, original)

          # 3) Venue profile forms: same 30-minute confirmation and remove the old CSS-generated second timing line.
          path = "venue-profile.js"
          original = Path(path).read_text(encoding="utf-8")
          text = original
          text = re.sub(r'const PREMIUM_SUCCESS = ".*?";', 'const PREMIUM_SUCCESS = ' + repr(DESIRED).replace("'", '"') + ';', text, count=1)
          text = text.replace("content:'Our team will review your requirement and call you within 1–2 hours with suitable venue options.'!important;display:block!important;", "content:none!important;display:none!important;")
          save(path, text, original)

          # 4) Venue marketplace capture handler overrides venue-profile submit listeners, so standardise it too.
          path = "venue-marketplace-upgrade.js"
          original = Path(path).read_text(encoding="utf-8")
          text = original
          text = text.replace("✓ Your requirement is already received. Our team will call you within 1 hour with suitable venue options.", DESIRED)
          text = text.replace("✓ Requirement received! Our team will call you within 1 hour with suitable venue options.", DESIRED)
          save(path, text, original)

          # 5) Browse Venues multi-venue enquiry: store typed requirements as CRM comment and use same confirmation.
          path = "venues.js"
          original = Path(path).read_text(encoding="utf-8")
          text = original
          multi_old = 'budget_per_person:budget,requirements,source:"Website - Multi Venue Enquiry",status:"new"'
          multi_new = 'budget_per_person:budget,contact_remark:other||null,internal_notes:other||null,requirements,source:"Website - Multi Venue Enquiry",status:"new"'
          if multi_old in text:
              text = text.replace(multi_old, multi_new, 1)
          text = text.replace("✓ Enquiry received. Your selected venues are attached to this request.", DESIRED)
          save(path, text, original)

          # 6) Legacy Smart Match files: keep future/alternate form confirmation consistent too.
          path = "smv-smart-match-core.js"
          original = Path(path).read_text(encoding="utf-8")
          text = original
          old_card = '<div class="smv-success-card" id="smvSuccess"><div class="smv-success-top"><div class="smv-success-icon">✓</div><div><h5>Requirement received successfully!</h5><p>Thank you. Your Smart Match has been shared with Select My Venue.</p></div></div><div class="smv-success-next"><b>What happens next:</b> We’ll review your requirement and help identify suitable venue options for your event.</div></div>'
          new_card = '<div class="smv-success-card" id="smvSuccess"><div class="smv-success-top"><div class="smv-success-icon">✓</div><div><h5>Requirement received!</h5><p>' + DESIRED + '</p></div></div></div>'
          if old_card in text:
              text = text.replace(old_card, new_card, 1)
          save(path, text, original)

          path = "smv-smart-match.js"
          original = Path(path).read_text(encoding="utf-8")
          text = original
          old_line = "message.innerHTML='<span class=\"smv-confirmation-title\">✓ Requirement received successfully</span><span class=\"smv-confirmation-sub\">Thank you. Our team will review your event details and help you with suitable venue options.'+waText+'</span>';"
          new_line = "message.textContent=" + repr(DESIRED) + ";"
          if old_line in text:
              text = text.replace(old_line, new_line, 1)
          save(path, text, original)

          # 7) Cache-bust every public HTML reference to the updated form scripts.
          versions = {
              "homepage-venues.js": "20260909-enquiry-fix-4",
              "quick-enquiry.js": "20260909-enquiry-fix-4",
              "venue-profile.js": "20260909-enquiry-fix-4",
              "venue-marketplace-upgrade.js": "20260909-enquiry-fix-4",
              "venues.js": "20260909-enquiry-fix-4",
              "smv-smart-match.js": "20260909-enquiry-fix-4",
          }
          for html in Path('.').glob('*.html'):
              original = html.read_text(encoding='utf-8')
              text = original
              for filename, version in versions.items():
                  text = re.sub(re.escape(filename) + r'\?v=[^\"\']+', filename + '?v=' + version, text)
              save(str(html), text, original)

          # Guardrails: the active files must now contain the intended behavior.
          home = Path("homepage-venues.js").read_text(encoding="utf-8")
          if DESIRED not in home or "delete next.priority;" not in home or "next.internal_notes = comment" not in home:
              raise SystemExit("Homepage guardrail failed")
          quick = Path("quick-enquiry.js").read_text(encoding="utf-8")
          if DESIRED not in quick or "payload.internal_notes = comment" not in quick:
              raise SystemExit("Quick enquiry guardrail failed")
          venue = Path("venue-profile.js").read_text(encoding="utf-8")
          market = Path("venue-marketplace-upgrade.js").read_text(encoding="utf-8")
          if DESIRED not in venue or DESIRED not in market:
              raise SystemExit("Venue profile guardrail failed")

          print("Changed files:")
          for item in sorted(set(changed)):
              print(" -", item)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Select My Venue Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Fix enquiry storage comments and confirmations"
          git push origin HEAD:main
