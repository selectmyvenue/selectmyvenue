name: One-time enquiry consistency fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-enquiry-fix.yml'

permissions:
  contents: write

jobs:
  fix-enquiries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct storage fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          DESIRED = "Requirement received! Thank you for choosing Select My Venue. Our venue team will contact you within 30 minutes to understand your event and help you with suitable venue options."
          changed=[]
          def save(path,text,old):
              if text != old:
                  Path(path).write_text(text,encoding='utf-8')
                  changed.append(path)

          # Directly fix the legacy homepage handlers rather than relying only on a runtime bridge.
          path='script.js'
          old=Path(path).read_text(encoding='utf-8')
          text=old

          # Remove every public lead priority assignment. The database check constraint has rejected
          # legacy lowercase priority values; public website forms do not need to set priority.
          text=re.sub(r'\n\s*priority:\s*calculateLeadPriority\(plan\),?', '', text)

          # Main homepage enquiry: preserve customer-written requirement in both customer remark and
          # internal_notes because the Master CRM Comment column reads internal_notes.
          main_old='''          requirements,\n\n          source:\n            leadSource,'''
          main_new='''          requirements,\n\n          contact_remark:\n            customerRequirements || null,\n\n          internal_notes:\n            customerRequirements || null,\n\n          source:\n            leadSource,'''
          if main_old in text and 'internal_notes:\n            customerRequirements || null' not in text:
              text=text.replace(main_old,main_new,1)

          # Popup enquiry: same mapping for its OTHER REQUIREMENTS field.
          popup_old='''      requirements: requirements,\n      source: "Website - Enquiry Popup",'''
          popup_new='''      requirements: requirements,\n      contact_remark: other || null,\n      internal_notes: other || null,\n      source: "Website - Enquiry Popup",'''
          if popup_old in text and 'contact_remark: other || null' not in text:
              text=text.replace(popup_old,popup_new,1)

          # Exact customer confirmation in main form and popup success screen.
          text=text.replace('✓ Thank you! Your venue requirement has been received. Select My Venue will review your event details and contact you with suitable options.',DESIRED)
          popup_para=re.compile(r'''<p>\s*Thank you\. Your venue requirement has been submitted\s*successfully and saved with our venue enquiry team\.\s*Our Select My Venue team will review your details and\s*contact you with suitable options\.\s*</p>''',re.S)
          text=popup_para.sub('<p>'+DESIRED+'</p>',text)

          save(path,text,old)

          # Ensure active compatibility layer keeps the same rules.
          path='homepage-venues.js'
          old=Path(path).read_text(encoding='utf-8')
          text=old
          text=re.sub(r'const SUCCESS_TEXT = ".*?";', 'const SUCCESS_TEXT = '+repr(DESIRED).replace("'",'"')+';', text, count=1)
          if 'delete next.priority;' not in text:
              text=text.replace('const next = { ...row };','const next = { ...row };\n              delete next.priority;',1)
          if 'next.internal_notes = comment' not in text:
              text=text.replace('if (comment && !clean(next.contact_remark)) next.contact_remark = comment;','if (comment && !clean(next.contact_remark)) next.contact_remark = comment;\n              if (comment && !clean(next.internal_notes)) next.internal_notes = comment;',1)
          save(path,text,old)

          # Standardize every remaining active form confirmation and comment routing.
          for path in ['quick-enquiry.js','venue-profile.js','venue-marketplace-upgrade.js','venues.js','smv-smart-match.js','smv-smart-match-core.js']:
              old=Path(path).read_text(encoding='utf-8')
              text=old
              text=text.replace('✓ Your requirement is already received. Our team will call you within 1 hour with suitable venue options.',DESIRED)
              text=text.replace('✓ Requirement received! Our team will call you within 1 hour with suitable venue options.',DESIRED)
              text=text.replace('✓ Enquiry received. Your selected venues are attached to this request.',DESIRED)
              if path=='quick-enquiry.js':
                  text=re.sub(r'const PREMIUM_SUCCESS = ".*?";', 'const PREMIUM_SUCCESS = '+repr(DESIRED).replace("'",'"')+';', text, count=1)
                  if 'if (comment) payload.internal_notes = comment;' not in text:
                      text=text.replace('if (comment) payload.contact_remark = comment;','if (comment) payload.contact_remark = comment;\n      if (comment) payload.internal_notes = comment;',1)
              if path=='venue-profile.js':
                  text=re.sub(r'const PREMIUM_SUCCESS = ".*?";', 'const PREMIUM_SUCCESS = '+repr(DESIRED).replace("'",'"')+';', text, count=1)
                  text=re.sub(r"content:'Our team will review your requirement and call you within [^']*'!important;display:block!important;", "content:none!important;display:none!important;", text)
              save(path,text,old)

          # Force browsers/GitHub Pages to fetch the repaired JS rather than a stale cached copy.
          for html in Path('.').glob('*.html'):
              old=html.read_text(encoding='utf-8')
              text=old
              files=['script.js','homepage-venues.js','quick-enquiry.js','venue-profile.js','venue-marketplace-upgrade.js','venues.js','smv-smart-match.js']
              for filename in files:
                  text=re.sub(re.escape(filename)+r'(?:\?v=[^\"\']+)?',filename+'?v=20260909-enquiry-fix-5',text)
              save(str(html),text,old)

          # Guardrails.
          script=Path('script.js').read_text(encoding='utf-8')
          if 'priority:\n            calculateLeadPriority(plan)' in script or 'priority: calculateLeadPriority(plan)' in script:
              raise SystemExit('Legacy website priority assignment still exists')
          if 'internal_notes:\n            customerRequirements || null' not in script:
              raise SystemExit('Main customer comment mapping missing')
          if 'internal_notes: other || null' not in script:
              raise SystemExit('Popup customer comment mapping missing')
          home=Path('homepage-venues.js').read_text(encoding='utf-8')
          if DESIRED not in home or 'delete next.priority;' not in home or 'next.internal_notes = comment' not in home:
              raise SystemExit('Homepage compatibility guardrail failed')
          if DESIRED not in Path('venue-profile.js').read_text(encoding='utf-8'):
              raise SystemExit('Venue profile confirmation guardrail failed')

          print('Changed files:')
          for x in sorted(set(changed)): print(' -',x)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Select My Venue Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Harden website enquiry storage and comment routing"
          git push origin HEAD:main
