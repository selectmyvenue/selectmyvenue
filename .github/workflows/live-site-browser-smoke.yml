name: Live website page and mobile smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * 1'
  pull_request:
    paths:
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/live-site-browser-smoke.yml'

permissions:
  contents: read

concurrency:
  group: live-site-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live landing pages on mobile and desktop
        run: node tests/browser-smoke.mjs
