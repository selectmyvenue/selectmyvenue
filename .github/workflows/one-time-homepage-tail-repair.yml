name: One-time homepage script loading repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-homepage-tail-repair.yml'

permissions:
  contents: write

jobs:
  repair-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair homepage script block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          original = path.read_text(encoding='utf-8')
          version = '20260909-comment-fix-7'
          replacement = '<!-- =====================================================\n     SUPABASE LIBRARY\n     MUST LOAD BEFORE script.js\n====================================================== -->\n\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n\n\n<!-- =====================================================\n     SELECT MY VENUE WEBSITE JAVASCRIPT\n====================================================== -->\n\n<script src="script.js?v=' + version + '"></script>\n\n<script src="homepage-venues.js?v=' + version + '"></script>\n\n\n</body>\n</html>'
          pattern = re.compile(r'<!-- =====================================================\s*\n\s*SUPABASE LIBRARY[\s\S]*?</body>\s*</html>\s*$', re.I)
          text, count = pattern.subn(replacement, original, count=1)
          if count != 1:
              raise SystemExit('Could not locate homepage Supabase/script tail for repair')
          path.write_text(text, encoding='utf-8')
          repaired = path.read_text(encoding='utf-8')
          if '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>' not in repaired:
              raise SystemExit('Supabase script is still missing')
          if 'script.js?v=' + version not in repaired or 'homepage-venues.js?v=' + version not in repaired:
              raise SystemExit('Homepage script cache version is incorrect')
          if repaired.count('@supabase/supabase-js@2') != 1:
              raise SystemExit('Unexpected Supabase script count after repair')
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Select My Venue Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Repair homepage Supabase and enquiry script loading"
          git push origin HEAD:main
