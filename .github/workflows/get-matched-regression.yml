name: Get Matched browser regression

on:
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'tests/get-matched-browser-smoke.mjs'
      - '.github/workflows/get-matched-regression.yml'
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'tests/get-matched-browser-smoke.mjs'
      - '.github/workflows/get-matched-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-matched-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the PR files locally
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/smv-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
      - name: Exercise the PR checkout (no enquiry submissions)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          SMV_SITE_BASE_URL: http://127.0.0.1:4173
        run: node tests/get-matched-browser-smoke.mjs
      - name: Wait for deployed Get Matched and directory assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SMV_SITE_BASE_URL: https://selectmyvenue.com
        run: |
          set -eu
          for attempt in $(seq 1 36); do
            html="$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$SMV_SITE_BASE_URL/" 2>/dev/null || true)"
            script="$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$SMV_SITE_BASE_URL/quick-enquiry.js?v=20261018-desktop-drawer-fix-4" 2>/dev/null || true)"
            directory_html="$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$SMV_SITE_BASE_URL/venues.html" 2>/dev/null || true)"
            directory_script="$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$SMV_SITE_BASE_URL/venues.js?v=20261018-search-header-fallback-1" 2>/dev/null || true)"
            if printf '%s' "$html" | grep -Fq 'quick-enquiry.js?v=20261018-desktop-drawer-fix-4' &&
               printf '%s' "$script" | grep -Fq 'Capture only after movement crosses the drag threshold' &&
               printf '%s' "$script" | grep -Fq 'Every close path, including Escape' &&
               printf '%s' "$directory_html" | grep -Fq 'venues.js?v=20261018-search-header-fallback-1' &&
               printf '%s' "$directory_script" | grep -Fq 'The public directory uses .site-header rather than .page-header'; then
              echo 'PASS production serves the fixed Get Matched asset and cache-busted venue directory search fallback'
              exit 0
            fi
            echo "Production has not served both expected assets yet (attempt $attempt/36); retrying in 10 seconds"
            sleep 10
          done
          echo 'ERROR production did not serve the expected Get Matched and directory asset revisions within six minutes'
          exit 1
      - name: Verify the live production site (no enquiry submissions)
        if: always()
        env:
          SMV_SITE_BASE_URL: https://selectmyvenue.com
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: node tests/get-matched-browser-smoke.mjs
