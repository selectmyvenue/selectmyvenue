name: SEO audit unit tests

on:
  push:
    branches:
      - seo/all-intent-enquiry-coverage
      - seo/delhi-gurgaon-venue-engine-review
    paths:
      - 'seo/**'
      - '*.html'
      - 'website-mobile-app-20261002.js'
      - 'sitemap.xml'
      - '.github/workflows/seo-audit-tests.yml'
      - '.github/workflows/prepare-seo-venue-pages.yml'
      - '.github/workflows/publish-generated-venue-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'seo/**'
      - '*.html'
      - 'sitemap.xml'
      - '.github/workflows/seo-audit-tests.yml'
      - '.github/workflows/prepare-seo-venue-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check customer mobile app JavaScript syntax
        run: node --check website-mobile-app-20261002.js
      - name: Check website enquiry and SEO attribution JavaScript syntax
        run: node --check script.js
      - name: Check quick SEO enquiry JavaScript syntax
        run: node --check quick-enquiry.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run existing landing-page and enquiry regression tests
        run: python seo/tests/test_all_event_venue_page.py -v
      - name: Run SEO generator and audit unit tests
        run: python -m unittest discover -s seo/tests -p 'test_*seo.py' -v
      - name: Run 500-page inventory audit unit tests
        run: python -m unittest discover -s seo/tests -p 'test_audit_500_page_inventory.py' -v
      - name: Audit 500-page candidate inventory against existing pages and sitemap
        run: python seo/audit_500_page_inventory.py
      - name: Run read-only static SEO audit
        run: python seo/audit_static_seo.py
